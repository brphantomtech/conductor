# Conductor — plain Kubernetes manifest (Profile C, SPEC §3.2).
#
# A non-Helm starting point equivalent to the sample chart under
# deploy/helm/conductor. Apply with:
#
#   kubectl apply -f deploy/k8s/conductor.yaml
#
# Replace the placeholder HARNESS.md, image, and secret values for your
# environment. Secrets ($TRACKER_API_KEY, $PROVIDER_API_KEY) come from the
# Secret below and are expanded by Conductor at config load (SPEC §6.2).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor
  labels:
    app.kubernetes.io/name: conductor
data:
  HARNESS.md: |-
    ---
    project:
      id: example
      name: Example Project
    tracker:
      kind: github
      api_key: $TRACKER_API_KEY
      project_id: example/repo
    providers:
      default:
        provider: anthropic
        model: claude-sonnet-4-5
        api_key: $PROVIDER_API_KEY
    ---
---
apiVersion: v1
kind: Secret
metadata:
  name: conductor-secrets
  labels:
    app.kubernetes.io/name: conductor
type: Opaque
stringData:
  TRACKER_API_KEY: "replace-me"
  PROVIDER_API_KEY: "replace-me"
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  labels:
    app.kubernetes.io/name: conductor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: conductor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  labels:
    app.kubernetes.io/name: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: conductor
          image: conductor:latest
          args: ["start", "--harness", "/etc/conductor/HARNESS.md"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: conductor-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: harness
              mountPath: /etc/conductor
              readOnly: true
      volumes:
        - name: harness
          configMap:
            name: conductor
